name: Database tests

on:
  push:
    branches: [main, feature/database]
  pull_request:
    branches: [main]

jobs:
  test-database:
    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install database dependencies
        run: npm --prefix database ci
      - name: Test database and route contract
        env:
          MONGO_URI: mongodb://127.0.0.1:27017
        run: npm --prefix database test
